<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Randi Jewellers</title>
    <link rel="stylesheet" type="text/css" href="css/styles.css">
    <style>
        .admin-container {
            max-width: 600px;
            margin: 100px auto;
            background: var(--bg-off-white);
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            border-top: 5px solid var(--primary-red);
            transition: max-width 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }
        .admin-container.wide {
            max-width: 950px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }
        input[type="text"], input[type="password"], textarea, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #CCC;
            border-radius: 4px;
            font-family: var(--font-body);
        }
        .btn-submit {
            background: var(--primary-red);
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            font-family: var(--font-heading);
            width: 100%;
            transition: var(--transition);
        }
        .btn-submit:hover {
            background: var(--accent-gold);
            color: var(--text-dark);
        }
        #uploadSection {
            display: none;
        }
        .message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 4px;
            display: none;
        }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }

        /* Manage existing gallery grid */
        .manage-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
            margin-top: 15px;
        }
        .manage-item {
            background: white;
            border: 1px solid #EAEAEA;
            border-radius: 6px;
            overflow: hidden;
            text-align: center;
            padding: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .manage-item img {
            width: 100%;
            height: 120px;
            object-fit: cover;
            border-radius: 4px;
            margin-bottom: 8px;
        }
        .manage-item .img-info {
            font-size: 12px;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #444;
            font-weight: 500;
        }
        .manage-item .img-category {
            font-size: 11px;
            color: var(--accent-gold);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            font-weight: 600;
        }
        .btn-delete {
            background: #dc3545;
            color: white;
            padding: 8px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-family: var(--font-heading);
            width: 100%;
            transition: var(--transition);
        }
        .btn-delete:hover {
            background: #bd2130;
        }
    </style>
</head>
<body>
    <nav id="navbar">
        <div class="logo">RJ Admin</div>
        <ul class="nav-links">
            <li><a href="/logout">Back to Site</a></li>
        </ul>
    </nav>

    <div class="admin-container">
        <!-- Login Section -->
        <div id="loginSection">
            <h2>Admin Login</h2>
            <br>
            <form id="loginForm">
                <div class="form-group">
                    <label>Password:</label>
                    <input type="password" id="password" required>
                </div>
                <button type="submit" class="btn-submit">Login</button>
            </form>
            <div id="loginMsg" class="message error"></div>
        </div>

        <!-- Upload Section -->
        <div id="uploadSection">
            <h2>Upload New Image</h2>
            <br>
            <form id="uploadForm">
                <div class="form-group">
                    <label>Image File:</label>
                    <input type="file" id="imageFile" accept="image/*" required>
                </div>
                <div class="form-group">
                    <label>Category:</label>
                    <select id="category" required>
                        <option value="gold">Gold Works</option>
                        <option value="silver">Silver Works</option>
                        <option value="large">Large Scale Works</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Title (Optional for featured):</label>
                    <input type="text" id="title" placeholder="e.g. The Golden Cobra">
                </div>
                <div class="form-group">
                    <label>Description (Optional for featured):</label>
                    <textarea id="description" rows="3"></textarea>
                </div>
                <div class="form-group">
                    <label>
                        <input type="checkbox" id="isFeatured"> Highlight as Featured Item?
                    </label>
                </div>
                <button type="submit" class="btn-submit">Upload</button>
            </form>
            <div id="uploadMsg" class="message"></div>
        </div>

        <!-- Manage Existing Gallery Section -->
        <div id="manageSection" style="display: none; margin-top: 40px; border-top: 1px solid #DDD; padding-top: 30px;">
            <h2>Manage Existing Gallery</h2>
            <br>
            <div id="manageGrid" class="manage-grid">
                <!-- JavaScript will dynamically render cards here -->
            </div>
        </div>
    </div>

    <script src="javascript/admin.js"></script>
</body>
</html>
